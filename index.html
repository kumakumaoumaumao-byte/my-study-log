<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="学習した内容と時間を記録して、日々の積み重ねを見える化する学習ログアプリです。"
    />
    <title>まいにち学習ログ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">MY STUDY LOG</p>
            <h1 id="app-title">まいにち<br />学習ログ</h1>
            <p class="intro-copy">学んだことを、少しずつ記録しよう。</p>
          </div>
          <div class="save-state" id="save-state" aria-live="polite">未保存</div>
        </div>

        <form id="study-form" class="study-form">
          <label class="field-label" for="entry-date">学習した日</label>
          <input id="entry-date" name="date" type="date" required />

          <label class="field-label" for="entry-subject">学習したこと</label>
          <input
            id="entry-subject"
            name="subject"
            type="text"
            maxlength="60"
            placeholder="例：英単語、数学の復習"
            autocomplete="off"
            required
          />

          <label class="field-label" for="entry-minutes">学習時間</label>
          <div class="duration-input">
            <input
              id="entry-minutes"
              name="minutes"
              type="number"
              min="1"
              max="1440"
              step="1"
              placeholder="30"
              required
            />
            <span>分</span>
          </div>
          <p class="field-hint">1〜1440分で入力できます。</p>

          <label class="field-label" for="entry-note">ひとことメモ <span>任意</span></label>
          <textarea
            id="entry-note"
            name="note"
            rows="4"
            maxlength="200"
            placeholder="気づいたことや、次にやることを書いておこう"
          ></textarea>
          <div class="note-meta">
            <span id="editing-label">今日の学習を記録しています</span>
            <span><span id="char-count">0</span>/200</span>
          </div>

          <div class="action-row">
            <button class="primary-button" type="submit">学習ログを保存</button>
            <button class="ghost-button" type="button" id="clear-button">入力をクリア</button>
          </div>
          <p class="privacy-note">記録はこのブラウザに保存されます。個人情報は入力しないでください。</p>
        </form>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-header">
          <div>
            <p class="eyebrow">YOUR PROGRESS</p>
            <h2 id="history-title">学習の記録</h2>
          </div>
          <div class="stats-strip" aria-label="学習記録の件数">
            <strong id="entry-count">0</strong>
            <span>件</span>
          </div>
        </div>

        <section class="study-progress" aria-labelledby="progress-title">
          <div>
            <p class="progress-label" id="progress-title">学習時間の積み重ね</p>
            <strong id="progress-message">記録を保存すると、ここに表示されます</strong>
          </div>
          <div class="rhythm-chart" id="rhythm-chart" aria-label="最近7件の学習時間"></div>
          <p id="progress-detail" class="progress-detail">記録を続けると、最近の学習時間を確認できます。</p>
        </section>

        <div class="summary-row" id="summary-row" aria-label="学習時間の集計"></div>

        <div class="list-tools">
          <label class="search-box" for="search-input">
            <span>学習ログを検索</span>
            <input id="search-input" type="search" placeholder="学習内容やメモを検索" />
          </label>
        </div>

        <div id="empty-state" class="empty-state">
          <strong>学習ログはまだありません</strong>
          <span>今日学んだことを記録して、最初の一歩を残しましょう。</span>
        </div>

        <ul id="entry-list" class="entry-list" aria-label="保存した学習ログ一覧"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
